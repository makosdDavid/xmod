<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X4 Companion</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-state="noserver">
<header id="topbar">
  <div class="tb-brand"><span class="logo">X4</span><span class="brandname">Companion</span></div>
  <span id="st-state" class="pill bad">indul…</span><span id="st-age" class="muted"></span>
  <div class="tb-group grow-1"><span class="lbl">Kapitány</span><b id="st-name">–</b></div>
  <div class="tb-group"><span class="lbl">Kredit</span><b id="st-money" class="money">–</b></div>
  <div class="tb-group grow-1"><span class="lbl">Szektor</span><b id="st-sector">–</b></div>
  <div class="tb-group ship grow-2"><span class="lbl">Hajó</span><b id="st-ship">–</b>
    <span class="bars"><span id="st-hull" class="bar hull" title="burkolat"><span></span></span><span id="st-shield" class="bar shield" title="pajzs"><span></span></span></span>
    <span id="st-speed" class="muted num">–</span></div>
  <div class="tb-group target grow-1"><span class="lbl">Célpont</span><span id="st-target" class="muted">–</span></div>
  <div class="tb-spacer"></div>
  <div class="tb-group"><span id="st-time" class="muted">–</span></div>
  <div class="tb-group tb-buttons">
    <button id="btn-help" class="icon-btn" title="Gyorsgombok és billentyűk (?)" aria-label="Súgó"></button>
    <button id="btn-font" class="icon-btn" title="Betűméret">A±</button>
    <button id="btn-control" title="Parancsok küldése a játéknak (a mod engedélyezőlistája szerint)">Vezérlés</button>
  </div>
</header>
<nav id="nav" aria-label="Nézetek">
  <div id="views" class="views" role="tablist"></div>
  <div class="nav-spacer"></div>
  <div class="nav-tools">
    <span id="st-where" class="where muted"></span>
    <div class="menu" id="menu-modules"><button class="menu-btn" title="Modulok megjelenítése / elrejtése">Modulok ▾</button><div class="menu-pop" hidden></div></div>
    <div class="menu" id="menu-layout"><button class="menu-btn" title="Elrendezés-sablonok">Elrendezés ▾</button><div class="menu-pop" hidden></div></div>
  </div>
</nav>
<div id="alertbanner" hidden></div>
<div id="stalebanner"></div>
<main id="work"></main>
<aside id="drawer"></aside>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
